<!doctype html>
<html lang="es">
  <body style="font-family:Arial,sans-serif;background:#0e1217;color:#f4f1ea;padding:24px;">
    <div style="max-width:480px;margin:0 auto;background:#151b23;border:1px solid #2a3441;border-radius:12px;padding:24px;">
      <h2 style="margin:0 0 12px;color:#f58229;">Verifica tu cuenta en Mini-Games</h2>
      <p style="margin:0 0 16px;color:#cbd5e1;font-size:15px;line-height:1.5;">
        Introduce este código OTP de 6 dígitos en la pantalla de verificación para activar tu cuenta:
      </p>
      <div style="background:#0d1116;border:1px solid #334155;border-radius:10px;padding:16px;text-align:center;margin-bottom:16px;">
        <span style="font-family:monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#1ad1be;">{{ .Token }}</span>
      </div>
      <p style="margin:0 0 10px;color:#94a3b8;font-size:13px;">
        Solicitado para: <strong>{{ .Email }}</strong>
      </p>
      <p style="margin:0;color:#94a3b8;font-size:12px;">
        Si no solicitaste este registro, ignora este mensaje. El código expira automáticamente.
      </p>
    </div>
  </body>
</html>
